services:
  db:
    image: postgres:16-alpine
    container_name: gameverse_postgres
    restart: always
    environment:
      POSTGRES_USER: gameverse_user
      POSTGRES_PASSWORD: gameverse_password
      POSTGRES_DB: gameverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameverse_user -d gameverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gameverse_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: gameverse_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gameverse_user:gameverse_password@db:5432/gameverse_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=True
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
